name: Fork image

# Builds the bundled image (frontend + API, Dockerfile.kaneo) from this fork and
# publishes it to ghcr.io/<owner>/kaneo. Kept apart from build-images.yml, which
# needs Blacksmith runners, a release tag and upstream secrets that a fork lacks.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        required: true
        type: string
        default: main
      platforms:
        description: "Target platforms"
        required: true
        type: string
        default: linux/amd64

permissions:
  contents: read

jobs:
  build:
    if: github.repository != 'usekaneo/kaneo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Compute tags
        id: tags
        env:
          REF: ${{ inputs.ref }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/kaneo"
          sha="$(git rev-parse --short=7 HEAD)"
          tags="${image}:sha-${sha}"
          # Only main moves `latest`; other branches stay reachable by SHA.
          if [ "$REF" = "main" ]; then
            tags="${tags},${image}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.kaneo
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
